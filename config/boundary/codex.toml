# Qualification-only Codex profile. Authentication is provisioned into a
# disposable private CODEX_HOME at runtime and never enters an image layer.
model = "gpt-5.6-luna"
model_provider = "openai"
model_reasoning_effort = "low"
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"
web_search = "disabled"
cli_auth_credentials_store = "file"

[sandbox_workspace_write]
network_access = false

[features]
multi_agent = false

[mcp_servers]
